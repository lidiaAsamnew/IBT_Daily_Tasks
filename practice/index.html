<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addis Eats — Order Ethiopian Food Online</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">Addis <span>Eats</span></h1>
      <input
        id="search"
        type="search"
        placeholder="Search dishes… (e.g. doro, shiro)"
        aria-label="Search the menu"
      />
    </div>
  </header>

  <main>
    <section id="menu" class="menu-grid" aria-label="Menu" aria-live="polite">
      <p class="loading-msg">Loading menu…</p>
    </section>

    <aside id="cart" class="cart-panel" aria-label="Your order">
      <h2>Your Order</h2>
      <ul id="cart-list" class="cart-list"></ul>
      <p class="cart-total">Total: <span id="cart-total">0</span> ETB</p>
      <button id="checkout-btn" class="btn-primary" disabled>Checkout</button>
    </aside>
  </main>

  <!-- Checkout dialog -->
  <dialog id="checkout-dialog">
    <form id="checkout-form" novalidate>
      
      <h2>Checkout</h2>

      <label for="cust-name">Full name</label>
      <input id="cust-name" name="name" type="text" required minlength="2" />
      <p class="field-error" data-for="cust-name"></p>

      <label for="cust-phone">TeleBirr phone number</label>
      <input id="cust-phone" name="phone" type="tel" required pattern="^(09|07)\d{8}$" placeholder="09XXXXXXXX" />
      <p class="field-error" data-for="cust-phone"></p>

      <label for="cust-address">Delivery address (Addis Ababa)</label>
      <input id="cust-address" name="address" type="text" required minlength="5" />
      <p class="field-error" data-for="cust-address"></p>

      <p class="checkout-total">Total due: <strong><span id="checkout-total">0</span> ETB</strong></p>

      <div class="dialog-actions">
        <button type="button" id="cancel-checkout" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Place order</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer">
    <p>Bole, Addis Ababa · Pay with TeleBirr on delivery</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
